services:
  # Backend API
  - type: web
    name: block-ops-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: block-ops-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: 24

  # Frontend Static Site
  - type: web
    name: block-ops-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://block-ops-api.onrender.com

databases:
  - name: block-ops-db
    databaseName: block_ops
    region: oregon
    plan: free

